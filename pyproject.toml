[project]
name = "lx"
version = "0.1.0"
description = "Learn command-line tools by using real commands."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
]

[project.scripts]
lx = "lx.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]